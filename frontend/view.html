<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>观看屏幕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #1e3c72;
      color: white;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { margin-bottom: 2rem; }
    .container {
      background: rgba(255,255,255,0.1);
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      width: 100%;
      max-width: 800px;
    }
    input {
      padding: 1rem;
      font-size: 1.2rem;
      border-radius: 8px;
      border: none;
      width: 300px;
      text-align: center;
      margin: 1rem 0;
    }
    button {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      cursor: pointer;
      margin: 0.5rem;
    }
    button:hover { background: #5568d3; }
    button:disabled { background: #444; cursor: not-allowed; }
    #status { margin-top: 1rem; font-size: 1.1rem; }
    video {
      width: 100%;
      max-width: 1200px;
      margin-top: 2rem;
      background: black;
      border-radius: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>观看屏幕</h1>

  <div class="container">
    <p>请输入会话 ID：</p>
    <input type="text" id="sessionId" placeholder="例如: ws_abc123">
    <br>
    <button onclick="join()" id="joinBtn">连接</button>
    <button onclick="disconnect()" style="display:none;" id="disconnectBtn">断开</button>
    <p id="status">等待连接...</p>
  </div>

  <video id="video" autoplay playsinline muted></video>

  <script>
    const wsHost = window.location.hostname || 'localhost';
    const wsPort = window.location.port || '8080';
    const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const WS_URL = `${wsProtocol}//${wsHost}:${wsPort}/ws`;

    let ws = null;
    let pc = null;
    let currentSessionId = null;

    function setStatus(msg) { document.getElementById('status').textContent = msg; }

    async function join() {
      const sid = document.getElementById('sessionId').value.trim();
      if (!sid) { alert('请输入会话 ID'); return; }

      currentSessionId = sid;
      document.getElementById('joinBtn').disabled = true;
      setStatus('正在连接...');

      try {
        ws = new WebSocket(WS_URL);

        ws.onopen = () => {
          // 注册为 viewer
          ws.send(JSON.stringify({
            type: 'register_viewer',
            session_id: sid
          }));
          setStatus('已连接服务器，等待投屏方...');
        };

        ws.onmessage = async (event) => {
          try {
            const data = JSON.parse(event.data);
            console.log('[viewer] 收到消息:', data.type);

            if (data.type === 'offer') {
              await handleOffer(data);
            } else if (data.type === 'ice_candidate') {
              await handleIce(data);
            } else if (data.type === 'error') {
              setStatus('错误: ' + data.message);
            }
          } catch (e) {
            console.error('[viewer] 处理消息失败:', e);
            setStatus('错误: ' + e.message);
          }
        };

        ws.onerror = (e) => { console.error('[viewer] WS错误', e); setStatus('连接失败'); };
        ws.onclose = (e) => { console.log('[viewer] WS关闭', e.code, e.reason); setStatus('连接已断开'); };
      } catch (e) {
        setStatus('错误: ' + e.message);
        document.getElementById('joinBtn').disabled = false;
      }
    }

    function createPeerConnection() {
      pc = new RTCPeerConnection({
        iceServers: []
      });

      pc.onicecandidate = (event) => {
        if (!event.candidate || !ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({
          type: 'relay_ice',
          session_id: currentSessionId,
          candidate: event.candidate.candidate,
          sdpMid: event.candidate.sdpMid,
          sdpMLineIndex: event.candidate.sdpMLineIndex,
        }));
      };

      pc.ontrack = (event) => {
        const video = document.getElementById('video');
        video.srcObject = event.streams[0] || new MediaStream([event.track]);
        video.style.display = 'block';
        video.play().then(() => {
          setStatus('已连接 - 视频播放中');
        }).catch(err => {
          setStatus('播放失败: ' + err.message);
        });
        document.getElementById('disconnectBtn').style.display = 'inline-block';
      };

      pc.onconnectionstatechange = () => {
        console.log('[viewer] connectionState:', pc.connectionState);
        if (pc.connectionState === 'connected') setStatus('已连接');
        else if (pc.connectionState === 'failed') setStatus('连接失败');
      };

      pc.oniceconnectionstatechange = () => {
        console.log('[viewer] iceConnectionState:', pc.iceConnectionState);
      };

      pc.onicegatheringstatechange = () => {
        console.log('[viewer] iceGatheringState:', pc.iceGatheringState);
      };
    }

    async function handleOffer(data) {
      console.log('[viewer] handleOffer start, sdp length:', data.sdp?.length);
      if (!pc) createPeerConnection();

      setStatus('收到 Offer，生成 Answer...');
      console.log('[viewer] setRemoteDescription...');
      await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: data.sdp }));
      console.log('[viewer] setRemoteDescription done, createAnswer...');

      const answer = await pc.createAnswer();
      console.log('[viewer] createAnswer done, setLocalDescription...');
      await pc.setLocalDescription(answer);
      console.log('[viewer] setLocalDescription done, send answer');

      ws.send(JSON.stringify({
        type: 'relay_answer',
        session_id: currentSessionId,
        sdp: answer.sdp,
      }));

      setStatus('ICE 协商中...');
    }

    async function handleIce(data) {
      if (!pc) return;
      try {
        await pc.addIceCandidate(new RTCIceCandidate({
          candidate: data.candidate,
          sdpMid: data.sdpMid,
          sdpMLineIndex: data.sdpMLineIndex
        }));
      } catch (e) {}
    }

    function disconnect() {
      if (pc) { pc.close(); pc = null; }
      if (ws) { ws.close(); ws = null; }
      document.getElementById('video').srcObject = null;
      document.getElementById('video').style.display = 'none';
      document.getElementById('disconnectBtn').style.display = 'none';
      document.getElementById('joinBtn').disabled = false;
      currentSessionId = null;
      setStatus('已断开');
    }
  </script>
</body>
</html>
