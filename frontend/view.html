<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>观看屏幕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #1e3c72;
      color: white;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { margin-bottom: 2rem; }
    .container {
      background: rgba(255,255,255,0.1);
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      width: 100%;
      max-width: 800px;
    }
    input {
      padding: 1rem;
      font-size: 1.2rem;
      border-radius: 8px;
      border: none;
      width: 300px;
      text-align: center;
      margin: 1rem 0;
    }
    button {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      cursor: pointer;
      margin: 0.5rem;
    }
    button:hover { background: #5568d3; }
    #status { margin-top: 1rem; font-size: 1.1rem; }
    video {
      width: 100%;
      max-width: 1200px;
      margin-top: 2rem;
      background: black;
      border-radius: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>观看屏幕</h1>

  <div class="container">
    <p>请输入会话 ID：</p>
    <input type="text" id="sessionId" placeholder="例如: sess_abc123">
    <br>
    <button onclick="join()">连接</button>
    <button onclick="disconnect()" style="display:none;" id="disconnectBtn">断开</button>
    <p id="status">等待连接...</p>
  </div>

  <video id="video" autoplay playsinline muted></video>

  <script>
    // WebSocket 与 HTTP 共用端口
    const wsHost = window.location.hostname || 'localhost';
    const wsPort = window.location.port || '8080';
    const WS_URL = `ws://${wsHost}:${wsPort}/ws`;
    let ws = null;
    let pc = null;
    let sessionId = null;
    let reconnectTimer = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT = 3;

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function tryReconnect() {
      if (reconnectAttempts >= MAX_RECONNECT || !sessionId) return;
      reconnectAttempts++;
      const delay = 2000 * reconnectAttempts;
      setStatus(`连接断开，${delay/1000}秒后重连... (${reconnectAttempts}/${MAX_RECONNECT})`);
      reconnectTimer = setTimeout(() => join(), delay);
    }

    async function join() {
      if (!sessionId) {
        sessionId = document.getElementById('sessionId').value.trim();
      }
      if (!sessionId) {
        alert('请输入会话 ID');
        return;
      }

      setStatus('正在连接...');

      try {
        ws = new WebSocket(WS_URL);

        ws.onopen = () => {
          console.log('[WS] WebSocket 已连接');
          setStatus('已连接服务器，加入会话...');
          reconnectAttempts = 0;
          ws.send(JSON.stringify({
            type: 'join_session',
            session_id: sessionId
          }));
        };

        ws.onmessage = async (event) => {
          try {
            const data = JSON.parse(event.data);
            console.log('[WS] 收到消息:', data.type);

            if (data.type === 'offer') {
              await handleOffer(data.sdp);
            } else if (data.type === 'ice_candidate') {
              await handleIce(data.candidate);
            } else if (data.type === 'error') {
              console.error('[WS] 错误:', data.message);
              setStatus('错误: ' + data.message);
            } else if (data.type === 'session_ended') {
              setStatus('会话已结束');
            }
          } catch (e) {
            console.error('[WS] 消息处理失败:', e);
          }
        };

        ws.onerror = () => {
          setStatus('连接失败');
        };

        ws.onclose = () => {
          console.log('[WS] WebSocket 连接关闭');
          setStatus('连接已断开');
          tryReconnect();
        };

      } catch (error) {
        setStatus('错误: ' + error.message);
      }
    }

    function createPeerConnection() {
      console.log('[PC] 创建 PeerConnection');
      const config = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      };
      pc = new RTCPeerConnection(config);

      pc.onicegatheringstatechange = () => {
        console.log('[PC] ICE 收集状态:', pc.iceGatheringState);
      };

      pc.onicecandidate = (event) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        if (event.candidate) {
          ws.send(JSON.stringify({
            type: 'ice_candidate',
            session_id: sessionId,
            candidate: JSON.stringify(event.candidate)
          }));
        }
      };

      pc.ontrack = (event) => {
        console.log('[PC] 收到远程轨道:', event.track.kind);

        const video = document.getElementById('video');
        const stream = event.streams[0] || new MediaStream([event.track]);
        video.srcObject = stream;
        video.style.display = 'block';

        video.play().then(() => {
          setStatus('已连接 - 视频播放中');
        }).catch(err => {
          setStatus('错误: 视频播放失败 - ' + err.message);
        });

        document.getElementById('disconnectBtn').style.display = 'inline-block';
      };

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'connected') {
          console.log('[PC] WebRTC 连接成功!');
        } else if (pc.connectionState === 'failed') {
          setStatus('连接失败');
        }
      };

      pc.oniceconnectionstatechange = () => {
        console.log('[PC] ICE 连接状态:', pc.iceConnectionState);
      };
    }

    async function handleOffer(offerStr) {
      try {
        if (!pc) createPeerConnection();

        const offer = JSON.parse(offerStr);
        await pc.setRemoteDescription(new RTCSessionDescription(offer));

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'answer',
            session_id: sessionId,
            sdp: JSON.stringify(answer)
          }));
        }
      } catch (e) {
        console.error('[Offer] 处理失败:', e);
        setStatus('SDP 协商失败: ' + e.message);
      }
    }

    async function handleIce(candidateStr) {
      if (!pc) return;
      try {
        const candidate = JSON.parse(candidateStr);
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      } catch (e) {
        console.warn('[ICE] 添加候选失败:', e);
      }
    }

    function disconnect() {
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
      reconnectAttempts = MAX_RECONNECT; // 阻止自动重连
      sessionId = null;

      if (pc) {
        pc.close();
        pc = null;
      }
      if (ws) {
        ws.close();
        ws = null;
      }

      const video = document.getElementById('video');
      video.srcObject = null;
      video.style.display = 'none';
      document.getElementById('disconnectBtn').style.display = 'none';
      setStatus('已断开');
    }
  </script>
</body>
</html>
