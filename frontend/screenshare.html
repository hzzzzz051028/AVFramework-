<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>屏幕共享系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2rem;
    }

    .mode-selector {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .mode-btn {
      padding: 1rem 2rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }

    .mode-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .mode-btn.active {
      background: rgba(102, 126, 234, 0.6);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .panel {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 2rem;
      display: none;
    }

    .panel.active {
      display: block;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .controls {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-danger {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .status {
      text-align: center;
      color: white;
      margin-top: 1rem;
      font-size: 1.1rem;
    }

    .session-info {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
      text-align: center;
    }

    .session-id {
      font-size: 1.5rem;
      font-weight: bold;
      color: #10b981;
      margin: 0.5rem 0;
      user-select: all;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1rem;
    }

    input[type="text"] {
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      width: 300px;
      text-align: center;
    }

    .placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.5);
      font-size: 1.2rem;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🖥️ 屏幕共享系统</h1>

    <div class="mode-selector">
      <button class="mode-btn active" onclick="switchMode('share')" id="shareModeBtn">
        📤 共享屏幕
      </button>
      <button class="mode-btn" onclick="switchMode('view')" id="viewModeBtn">
        📥 观看屏幕
      </button>
    </div>

    <!-- 共享屏幕面板 -->
    <div class="panel active" id="sharePanel">
      <h2 style="color: white; text-align: center; margin-bottom: 1rem;">共享你的屏幕</h2>

      <div class="video-container">
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="placeholder" id="sharePlaceholder">点击开始共享屏幕</div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="startShareBtn" onclick="startScreenShare()">
          🎬 开始共享
        </button>
        <button class="btn btn-danger" id="stopShareBtn" onclick="stopScreenShare()" style="display: none;">
          🛑 停止共享
        </button>
      </div>

      <div class="status" id="shareStatus">准备就绪</div>

      <div class="session-info" id="shareSessionInfo" style="display: none;">
        <div style="color: rgba(255,255,255,0.7);">会话 ID</div>
        <div class="session-id" id="shareSessionId"></div>
        <div style="color: rgba(255,255,255,0.7); margin-top: 0.5rem;">
          在观看端输入此 ID 即可查看你的屏幕
        </div>
      </div>
    </div>

    <!-- 观看屏幕面板 -->
    <div class="panel" id="viewPanel">
      <h2 style="color: white; text-align: center; margin-bottom: 1rem;">观看屏幕共享</h2>

      <div class="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="placeholder" id="viewPlaceholder">输入会话 ID 开始观看</div>
      </div>

      <div class="controls">
        <div class="input-group">
          <input type="text" id="sessionIdInput" placeholder="输入会话 ID">
          <button class="btn btn-primary" id="joinBtn" onclick="joinSession()">
            🔗 连接
          </button>
        </div>
        <button class="btn btn-danger" id="disconnectBtn" onclick="disconnect()" style="display: none;">
          🛑 断开连接
        </button>
      </div>

      <div class="status" id="viewStatus">等待连接...</div>
    </div>
  </div>

  <script>
    // WebRTC 配置
    const WS_URL = 'ws://localhost:8081';

    let shareClient = null;
    let viewer = null;
    let currentMode = 'share';

    // 屏幕共享客户端
    class ScreenShareClient {
      constructor(wsUrl) {
        this.wsUrl = wsUrl;
        this.ws = null;
        this.pc = null;
        this.localStream = null;
        this.sessionId = null;
        this.onSessionCreated = null;
        this.onRemoteStream = null;
        this.onStateChange = null;
      }

      async startScreenShare() {
        try {
          // 获取屏幕共享流
          this.localStream = await navigator.mediaDevices.getDisplayMedia({
            video: {
              cursor: "always"
            },
            audio: false
          });

          await this.connect();
          await this.createSession();

        } catch (error) {
          console.error('Failed to start screen share:', error);
          throw error;
        }
      }

      async connect() {
        return new Promise((resolve, reject) => {
          this.ws = new WebSocket(this.wsUrl);

          this.ws.onopen = () => {
            console.log('✅ WebSocket connected');
            this.setupMessageHandler();
            resolve();
          };

          this.ws.onerror = (error) => {
            console.error('❌ WebSocket connection failed');
            reject(new Error('WebSocket connection failed'));
          };

          this.ws.onclose = () => {
            console.log('🔌 WebSocket disconnected');
          };
        });
      }

      setupMessageHandler() {
        this.ws.onmessage = async (event) => {
          try {
            const message = JSON.parse(event.data);
            console.log('📨 Received:', message.type);

            if (message.type === 'session_created') {
              this.sessionId = message.session_id;
              if (this.onSessionCreated) {
                this.onSessionCreated(this.sessionId);
              }
              await this.createAndSendOffer();
            } else if (message.type === 'answer') {
              await this.handleAnswer(message.sdp);
            } else if (message.type === 'ice') {
              await this.handleICECandidate(message.candidate);
            }

          } catch (error) {
            console.error('Message handling error:', error);
          }
        };
      }

      async createSession() {
        this.createPeerConnection();

        this.send({
          type: 'create_session'
        });
      }

      async createAndSendOffer() {
        const offer = await this.pc.createOffer({
          offerToReceiveVideo: false,
          offerToReceiveAudio: false
        });

        await this.pc.setLocalDescription(offer);

        this.send({
          type: 'offer',
          session_id: this.sessionId,
          sdp: JSON.stringify(offer)
        });
      }

      createPeerConnection() {
        const config = {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' }
          ]
        };

        this.pc = new RTCPeerConnection(config);

        // 添加屏幕共享流
        if (this.localStream) {
          this.localStream.getTracks().forEach(track => {
            this.pc.addTrack(track, this.localStream);
          });
        }

        this.pc.onicecandidate = (event) => {
          if (event.candidate && this.sessionId) {
            this.send({
              type: 'ice_candidate',
              session_id: this.sessionId,
              candidate: JSON.stringify(event.candidate)
            });
          }
        };

        this.pc.onconnectionstatechange = () => {
          console.log('🔄 Connection state:', this.pc.connectionState);
          if (this.onStateChange) {
            this.onStateChange(this.pc.connectionState);
          }
        };
      }

      async handleAnswer(sdpString) {
        const answer = JSON.parse(sdpString);
        await this.pc.setRemoteDescription(new RTCSessionDescription(answer));
      }

      async handleICECandidate(candidateString) {
        const candidate = JSON.parse(candidateString);
        await this.pc.addIceCandidate(new RTCIceCandidate(candidate));
      }

      send(message) {
        if (this.ws && this.ws.readyState === WebSocket.OPEN) {
          this.ws.send(JSON.stringify(message));
        }
      }

      stop() {
        console.log('🛑 Stopping screen share');

        if (this.localStream) {
          this.localStream.getTracks().forEach(track => track.stop());
          this.localStream = null;
        }

        if (this.pc) {
          this.pc.close();
          this.pc = null;
        }

        if (this.ws) {
          this.ws.close();
          this.ws = null;
        }
      }
    }

    // 屏幕观看客户端
    class ScreenViewer {
      constructor(wsUrl) {
        this.wsUrl = wsUrl;
        this.ws = null;
        this.pc = null;
        this.sessionId = null;
        this.onRemoteStream = null;
        this.onStateChange = null;
      }

      async connect() {
        return new Promise((resolve, reject) => {
          this.ws = new WebSocket(this.wsUrl);

          this.ws.onopen = () => {
            console.log('✅ Viewer WebSocket connected');
            this.setupMessageHandler();
            resolve();
          };

          this.ws.onerror = (error) => {
            console.error('❌ Viewer WebSocket connection failed');
            reject(new Error('WebSocket connection failed'));
          };

          this.ws.onclose = () => {
            console.log('🔌 Viewer WebSocket disconnected');
          };
        });
      }

      setupMessageHandler() {
        this.ws.onmessage = async (event) => {
          try {
            const message = JSON.parse(event.data);
            console.log('📨 Viewer received:', message.type);

            if (message.type === 'offer') {
              await this.handleOffer(message.offer);
            } else if (message.type === 'ice') {
              await this.handleICECandidate(message.candidate);
            }

          } catch (error) {
            console.error('Message handling error:', error);
          }
        };
      }

      async joinSession(sessionId) {
        this.sessionId = sessionId;
        this.createPeerConnection();

        this.send({
          type: 'join_session',
          session_id: sessionId
        });
      }

      createPeerConnection() {
        const config = {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' }
          ]
        };

        this.pc = new RTCPeerConnection(config);

        this.pc.onicecandidate = (event) => {
          if (event.candidate && this.sessionId) {
            this.send({
              type: 'ice_candidate',
              session_id: this.sessionId,
              candidate: JSON.stringify(event.candidate)
            });
          }
        };

        this.pc.ontrack = (event) => {
          console.log('📹 Received screen share track');
          if (this.onRemoteStream) {
            const [remoteStream] = event.streams;
            this.onRemoteStream(remoteStream);
          }
        };

        this.pc.onconnectionstatechange = () => {
          console.log('🔄 Connection state:', this.pc.connectionState);
          if (this.onStateChange) {
            this.onStateChange(this.pc.connectionState);
          }
        };
      }

      async handleOffer(sdpString) {
        if (!this.pc) {
          this.createPeerConnection();
        }

        const offer = JSON.parse(sdpString);
        await this.pc.setRemoteDescription(new RTCSessionDescription(offer));

        const answer = await this.pc.createAnswer();
        await this.pc.setLocalDescription(answer);

        this.send({
          type: 'answer',
          session_id: this.sessionId,
          sdp: JSON.stringify(answer)
        });
      }

      async handleICECandidate(candidateString) {
        const candidate = JSON.parse(candidateString);
        await this.pc.addIceCandidate(new RTCIceCandidate(candidate));
      }

      send(message) {
        if (this.ws && this.ws.readyState === WebSocket.OPEN) {
          this.ws.send(JSON.stringify(message));
        }
      }

      disconnect() {
        console.log('🛑 Disconnecting viewer');

        if (this.pc) {
          this.pc.close();
          this.pc = null;
        }

        if (this.ws) {
          this.ws.close();
          this.ws = null;
        }
      }
    }

    // UI 函数
    function switchMode(mode) {
      currentMode = mode;

      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));

      if (mode === 'share') {
        document.getElementById('shareModeBtn').classList.add('active');
        document.getElementById('sharePanel').classList.add('active');
      } else {
        document.getElementById('viewModeBtn').classList.add('active');
        document.getElementById('viewPanel').classList.add('active');
      }
    }

    async function startScreenShare() {
      try {
        updateStatus('shareStatus', '🔄 正在启动屏幕共享...');
        shareClient = new ScreenShareClient(WS_URL);

        shareClient.onSessionCreated = (sessionId) => {
          document.getElementById('shareSessionId').textContent = sessionId;
          document.getElementById('shareSessionInfo').style.display = 'block';
          updateStatus('shareStatus', '✅ 屏幕共享已启动！会话 ID: ' + sessionId);
        };

        shareClient.onStateChange = (state) => {
          console.log('Connection state:', state);
        };

        await shareClient.startScreenShare();

        // 显示本地视频
        const localVideo = document.getElementById('localVideo');
        localVideo.srcObject = shareClient.localStream;
        document.getElementById('sharePlaceholder').style.display = 'none';

        // 更新按钮
        document.getElementById('startShareBtn').style.display = 'none';
        document.getElementById('stopShareBtn').style.display = 'inline-block';

      } catch (error) {
        console.error('Error starting screen share:', error);
        updateStatus('shareStatus', '❌ 启动失败: ' + error.message);
      }
    }

    function stopScreenShare() {
      if (shareClient) {
        shareClient.stop();
        shareClient = null;
      }

      const localVideo = document.getElementById('localVideo');
      localVideo.srcObject = null;
      document.getElementById('sharePlaceholder').style.display = 'block';

      document.getElementById('startShareBtn').style.display = 'inline-block';
      document.getElementById('stopShareBtn').style.display = 'none';
      document.getElementById('shareSessionInfo').style.display = 'none';

      updateStatus('shareStatus', '准备就绪');
    }

    async function joinSession() {
      const sessionId = document.getElementById('sessionIdInput').value.trim();

      if (!sessionId) {
        alert('请输入会话 ID');
        return;
      }

      try {
        updateStatus('viewStatus', '🔄 正在连接...');

        viewer = new ScreenViewer(WS_URL);
        await viewer.connect();

        viewer.onRemoteStream = (stream) => {
          const remoteVideo = document.getElementById('remoteVideo');
          remoteVideo.srcObject = stream;
          document.getElementById('viewPlaceholder').style.display = 'none';
          updateStatus('viewStatus', '✅ 已连接到屏幕共享！');
        };

        viewer.onStateChange = (state) => {
          console.log('Connection state:', state);
          if (state === 'connected') {
            document.getElementById('joinBtn').style.display = 'none';
            document.getElementById('sessionIdInput').disabled = true;
            document.getElementById('disconnectBtn').style.display = 'inline-block';
          } else if (state === 'disconnected' || state === 'failed') {
            updateStatus('viewStatus', '❌ 连接已断开');
            disconnect();
          }
        };

        await viewer.joinSession(sessionId);

      } catch (error) {
        console.error('Error joining session:', error);
        updateStatus('viewStatus', '❌ 连接失败: ' + error.message);
      }
    }

    function disconnect() {
      if (viewer) {
        viewer.disconnect();
        viewer = null;
      }

      const remoteVideo = document.getElementById('remoteVideo');
      remoteVideo.srcObject = null;
      document.getElementById('viewPlaceholder').style.display = 'block';

      document.getElementById('joinBtn').style.display = 'inline-block';
      document.getElementById('sessionIdInput').disabled = false;
      document.getElementById('disconnectBtn').style.display = 'none';

      updateStatus('viewStatus', '等待连接...');
    }

    function updateStatus(elementId, message) {
      document.getElementById(elementId).textContent = message;
    }

    // 页面关闭时清理
    window.addEventListener('beforeunload', () => {
      stopScreenShare();
      disconnect();
    });
  </script>
</body>
</html>
