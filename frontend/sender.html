<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>无线投屏 - 发送端</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }

    h1 { font-size: 1.6rem; margin-bottom: 1.5rem; color: #f8fafc; }

    .main {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .card h3 {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 1rem;
    }

    .video-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    video { width: 100%; height: 100%; object-fit: contain; }

    .placeholder {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #475569;
      font-size: 1.1rem;
    }

    .controls {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.7rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-start {
      background: #3b82f6;
      color: white;
    }

    .btn-stop {
      background: #ef4444;
      color: white;
    }

    .btn-outline {
      background: transparent;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.9rem;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #475569;
      flex-shrink: 0;
    }

    .dot.active { background: #22c55e; }
    .dot.connecting { background: #f59e0b; animation: pulse 1s infinite; }
    .dot.error { background: #ef4444; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .config-row {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      margin-bottom: 0.6rem;
    }

    .config-row label {
      font-size: 0.85rem;
      color: #94a3b8;
      min-width: 90px;
    }

    .config-row input, .config-row select {
      flex: 1;
      padding: 0.5rem 0.7rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.3);
      color: #e2e8f0;
      font-size: 0.9rem;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: #3b82f6;
    }

    .log-area {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      padding: 0.6rem;
      font-family: 'Consolas', monospace;
      font-size: 0.75rem;
      max-height: 200px;
      overflow-y: auto;
      color: #64748b;
    }

    .log-area .info { color: #60a5fa; }
    .log-area .ok { color: #34d399; }
    .log-area .err { color: #f87171; }
    .log-area .warn { color: #fbbf24; }

    .session-badge {
      display: inline-block;
      padding: 0.4rem 0.8rem;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 6px;
      color: #22c55e;
      font-family: monospace;
      font-size: 1.1rem;
      user-select: all;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      font-size: 0.85rem;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .info-item .label { color: #64748b; }
    .info-item .value { color: #e2e8f0; font-family: monospace; }
  </style>
  <script src="error-handler.js"></script>
</head>
<body>
  <h1>无线投屏 - 发送端</h1>

  <div class="main">
    <!-- 视频预览 -->
    <div class="card">
      <h3>屏幕预览</h3>
      <div class="video-wrap">
        <video id="preview" autoplay muted playsinline></video>
        <div class="placeholder" id="ph">点击下方按钮开始投屏</div>
      </div>
      <div class="controls">
        <button class="btn btn-start" id="btnStart" onclick="startCast()">开始投屏</button>
        <button class="btn btn-stop" id="btnStop" onclick="stopCast()" style="display:none;">停止投屏</button>
      </div>
    </div>

    <!-- 状态 -->
    <div class="status-bar" id="statusBar">
      <div class="dot" id="dot"></div>
      <span id="statusText">等待开始</span>
    </div>

    <!-- 会话信息 -->
    <div class="card" id="sessionCard" style="display:none;">
      <h3>会话信息</h3>
      <div class="info-grid">
        <div class="info-item"><span class="label">会话 ID</span><span class="value" id="sessionId">—</span></div>
        <div class="info-item"><span class="label">状态</span><span class="value" id="rtcState">—</span></div>
        <div class="info-item"><span class="label">编码器</span><span class="value" id="codecInfo">—</span></div>
        <div class="info-item"><span class="label">分辨率</span><span class="value" id="resInfo">—</span></div>
      </div>
    </div>

    <!-- 设备发现 -->
    <div class="card">
      <h3>可用设备</h3>
      <div id="deviceList" style="min-height: 60px;">
        <div style="color: #94a3b8; text-align: center; padding: 1rem;">
          正在搜索设备...
        </div>
      </div>
      <div class="controls" style="margin-top: 0.5rem;">
        <button class="btn" onclick="discoverDevices()" style="padding: 0.5rem 1rem; font-size: 0.9rem;">🔄 刷新设备</button>
      </div>
    </div>

    <!-- 设置 -->
    <div class="card">
      <h3>投屏设置</h3>
      <div class="checkbox-row" style="margin-bottom: 0.8rem;">
        <input type="checkbox" id="chkAudio">
        <label for="chkAudio">共享系统音频</label>
      </div>
      <div class="config-row">
        <label>接收端地址</label>
        <input type="text" id="serverAddr" placeholder="自动 (当前页面地址)">
      </div>
      <div class="config-row">
        <label>信令模式</label>
        <select id="signalingMode">
          <option value="ws" selected>WebSocket (兼容)</option>
          <option value="whep">WHEP (HTTP)</option>
        </select>
      </div>
    </div>

    <!-- 日志 -->
    <div class="card">
      <h3>日志</h3>
      <div class="log-area" id="logArea"></div>
    </div>
  </div>

  <script>
    let pc = null;
    let localStream = null;
    let sessionId = null;
    let whepResourceUrl = null;
    let discoverIntervalId = null;

    function log(cls, msg) {
      const area = document.getElementById('logArea');
      const t = new Date().toLocaleTimeString();
      area.innerHTML += `<div><span style="color:#475569">[${t}]</span> <span class="${cls}">${msg}</span></div>`;
      area.scrollTop = area.scrollHeight;
      while (area.children.length > 80) area.removeChild(area.firstChild);
    }

    function setStatus(state, text) {
      document.getElementById('dot').className = 'dot ' + ({connected:'active',connecting:'connecting',error:'error'}[state] || '');
      document.getElementById('statusText').textContent = text;
    }

    function getBaseUrl() {
      const custom = document.getElementById('serverAddr').value.trim();
      if (custom) return custom.replace(/\/+$/, '');
      return window.location.origin;
    }

    function getWsUrl() {
      const base = getBaseUrl();
      const url = new URL(base);
      const wsProto = url.protocol === 'https:' ? 'wss:' : 'ws:';
      // WebSocket 与 HTTP 共用同一端口
      return `${wsProto}//${url.host}/ws`;
    }

    // ========================================
    // 设备发现功能
    // ========================================
    let discoveredDevices = [];
    let selectedDevice = null;

    async function discoverDevices() {
      try {
        log('info', '正在搜索投屏设备...');
        const baseUrl = window.location.origin;
        const response = await fetch(`${baseUrl}/api/discover`);
        const data = await response.json();

        if (data.devices && data.devices.length > 0) {
          discoveredDevices = data.devices;
          renderDeviceList(data.devices);
          log('ok', `发现 ${data.devices.length} 个设备`);
        } else {
          renderDeviceList([]);
          log('info', '未发现设备，请检查网络或手动输入地址');
        }
      } catch (e) {
        log('err', '设备搜索失败: ' + e.message);
        renderDeviceList([]);
      }
    }

    function renderDeviceList(devices) {
      const container = document.getElementById('deviceList');

      if (devices.length === 0) {
        container.innerHTML = `
          <div style="color: #94a3b8; text-align: center; padding: 1rem;">
            未发现设备
          </div>
        `;
        return;
      }

      container.innerHTML = devices.map((device, index) => `
        <div class="device-item ${selectedDevice === device.url ? 'selected' : ''}"
             style="padding: 0.8rem; margin-bottom: 0.5rem; border-radius: 8px;
                    border: 1px solid ${selectedDevice === device.url ? '#3b82f6' : 'rgba(255,255,255,0.1)'};
                    background: ${selectedDevice === device.url ? 'rgba(59,130,246,0.1)' : 'rgba(255,255,255,0.05)'};
                    cursor: pointer; display: flex; justify-content: space-between; align-items: center;
                    transition: all 0.2s;"
             onclick="selectDevice(${index})">
          <div>
            <div style="font-weight: 500; color: #e2e8f0;">${device.name || '未知设备'}</div>
            <div style="font-size: 0.85rem; color: #64748b;">${device.host}:${device.port}</div>
          </div>
          <div class="status-dot ${selectedDevice === device.url ? 'active' : ''}"
               style="width: 8px; height: 8px; border-radius: 50%; background: #22c55e;"></div>
        </div>
      `).join('');
    }

    function selectDevice(index) {
      const device = discoveredDevices[index];
      if (device) {
        selectedDevice = device.url;
        document.getElementById('serverAddr').value = device.url;
        renderDeviceList(discoveredDevices);
        log('info', `已选择设备: ${device.name} (${device.host})`);
      }
    }

    // 页面加载时自动搜索设备
    window.addEventListener('DOMContentLoaded', () => {
      discoverDevices();
      discoverIntervalId = setInterval(discoverDevices, 30000);
    });

    async function startCast() {
      try {
        setStatus('connecting', '正在获取屏幕...');
        log('info', '请求屏幕共享权限...');

        const audio = document.getElementById('chkAudio').checked;
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: { cursor: 'always' },
          audio: audio,
        });

        // 监听用户通过浏览器 UI 停止共享
        localStream.getVideoTracks()[0].onended = () => stopCast();

        document.getElementById('preview').srcObject = localStream;
        document.getElementById('ph').style.display = 'none';

        // 统计视频信息
        const vt = localStream.getVideoTracks()[0];
        const settings = vt.getSettings();
        document.getElementById('resInfo').textContent =
          `${settings.width || '?'}x${settings.height || '?'} @ ${settings.frameRate || '?'}fps`;

        const audioTracks = localStream.getAudioTracks();
        if (audioTracks.length > 0) {
          log('ok', `屏幕捕获: ${settings.width}x${settings.height} + 音频`);
        } else {
          log('ok', `屏幕捕获: ${settings.width}x${settings.height} (无音频)`);
        }

        const mode = document.getElementById('signalingMode').value;
        if (mode === 'whep') {
          await connectWHEP();
        } else {
          await connectWS();
        }
      } catch (e) {
        // 清理：连接失败时停止 MediaStream
        if (localStream) {
          localStream.getTracks().forEach(t => t.stop());
          localStream = null;
        }
        if (window.errorHandler) {
          window.errorHandler.handleError(e, '获取屏幕时出错');
        } else {
          setStatus('error', '启动失败: ' + e.message);
          log('err', e.message);
        }
      }
    }

    // ---- WHEP 模式 ----

    async function connectWHEP() {
      setStatus('connecting', 'WHEP 信令协商中...');
      log('info', '使用 WHEP 信令模式');

      pc = createPeerConnection();

      // ICE candidate handler 必须在 setLocalDescription 之前设置
      pc.onicecandidate = async (event) => {
        if (!event.candidate || !whepResourceUrl) return;
        try {
          await fetch(whepResourceUrl, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ candidates: [event.candidate.toJSON()] }),
          });
        } catch (e) {
          log('warn', 'ICE 候选发送失败: ' + e.message);
        }
      };

      // 添加轨道
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      log('info', 'SDP Offer 已生成');

      // 发送到 WHEP 端点
      const baseUrl = getBaseUrl();
      try {
        const resp = await fetch(baseUrl + '/api/sessions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sdp: offer.sdp }),
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${resp.status}`);
        }

        const data = await resp.json();
        sessionId = data.id;
        whepResourceUrl = baseUrl + '/api/sessions/' + sessionId;

        document.getElementById('sessionId').textContent = sessionId;
        document.getElementById('sessionCard').style.display = 'block';

        const answer = new RTCSessionDescription({ type: 'answer', sdp: data.sdp });
        await pc.setRemoteDescription(answer);
        log('ok', 'WHEP 会话已建立: ' + sessionId);
      } catch (e) {
        setStatus('error', 'WHEP 连接失败: ' + e.message);
        log('err', 'WHEP: ' + e.message);
        return;
      }

      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnStop').style.display = 'inline-block';
    }

    // ---- WebSocket 兼容模式 ----

    let wsConnection = null;
    let reconnectTimer = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT_ATTEMPTS = 5;
    const RECONNECT_DELAY = 2000;

    function cleanupPeerConnection() {
      if (pc) {
        pc.close();
        pc = null;
      }
    }

    async function connectWS() {
      setStatus('connecting', 'WebSocket 信令协商中...');
      log('info', '使用 WebSocket 信令模式');

      // 重连时先清理旧的 PeerConnection
      cleanupPeerConnection();

      const wsUrl = getWsUrl();

      try {
        wsConnection = new WebSocket(wsUrl);

        await new Promise((resolve, reject) => {
          wsConnection.onopen = () => {
            log('ok', 'WebSocket 已连接');
            reconnectAttempts = 0;
            resolve();
          };
          wsConnection.onerror = () => reject(new Error('WebSocket 连接失败'));
        });

        pc = createPeerConnection();

        // ICE candidate handler 在添加轨道前设置
        pc.onicecandidate = (event) => {
          if (!event.candidate) {
            log('info', 'ICE 候选收集完成');
            return;
          }
          log('info', '发送 ICE 候选: ' + event.candidate.candidate.split(':')[0]);
          if (wsConnection && wsConnection.readyState === WebSocket.OPEN) {
            wsConnection.send(JSON.stringify({
              type: 'ice_candidate',
              session_id: sessionId,
              candidate: JSON.stringify(event.candidate),
            }));
          }
        };

        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        sessionId = 'ws_' + Date.now().toString(36);

        wsConnection.send(JSON.stringify({
          type: 'offer',
          session_id: sessionId,
          sdp: JSON.stringify(offer),
        }));

        document.getElementById('sessionId').textContent = sessionId;
        document.getElementById('sessionCard').style.display = 'block';

        wsConnection.onmessage = async (event) => {
          const msg = JSON.parse(event.data);
          console.log('[WS] 收到消息:', msg.type);

          if (msg.type === 'answer') {
            log('info', '收到 SDP Answer...');
            const answer = JSON.parse(msg.sdp);
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
            log('ok', 'SDP Answer 已设置, Remote Description: ' + answer.type);
          } else if (msg.type === 'ice_candidate') {
            log('info', '收到 ICE 候选');
            const candidate = JSON.parse(msg.candidate);
            await pc.addIceCandidate(new RTCIceCandidate(candidate));
          }
        };

        wsConnection.onclose = () => {
          log('warn', 'WebSocket 连接关闭');
          handleReconnect();
        };

        wsConnection.onerror = (error) => {
          log('err', 'WebSocket 错误');
          handleReconnect();
        };

        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnStop').style.display = 'inline-block';

      } catch (error) {
        setStatus('error', '连接失败');
        log('err', error.message);
        handleReconnect();
      }
    }

    function handleReconnect() {
      if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
        setStatus('error', '重连失败，请手动重试');
        log('err', '达到最大重连次数');
        return;
      }

      reconnectAttempts++;
      const delay = RECONNECT_DELAY * reconnectAttempts;

      setStatus('connecting', `连接断开，${delay/1000}秒后重连... (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
      log('warn', `${delay/1000}秒后尝试第 ${reconnectAttempts} 次重连...`);

      reconnectTimer = setTimeout(() => {
        if (localStream && localStream.getTracks().some(t => t.readyState === 'live')) {
          connectWS();
        } else {
          setStatus('error', '屏幕共享已结束，请重新开始');
          log('err', 'MediaStream 轨道已失效');
        }
      }, delay);
    }

    // ---- 公共 ----

    function createPeerConnection() {
      const config = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ],
        iceCandidatePoolSize: 10
      };
      const conn = new RTCPeerConnection(config);

      // 跟踪 ICE 收集状态
      conn.onicegatheringstatechange = () => {
        log('info', 'ICE 收集状态: ' + conn.iceGatheringState);
      };

      conn.onconnectionstatechange = () => {
        const s = conn.connectionState;
        document.getElementById('rtcState').textContent = s;
        log('info', 'RTC 连接状态: ' + s);

        if (s === 'connected') setStatus('connected', '投屏中');
        else if (s === 'disconnected') setStatus('error', '连接断开');
        else if (s === 'failed') setStatus('error', '连接失败');
      };

      conn.oniceconnectionstatechange = () => {
        const state = conn.iceConnectionState;
        log('info', 'ICE 连接状态: ' + state);
        if (state === 'connected') {
          log('ok', 'ICE 连接成功!');
        } else if (state === 'failed') {
          log('err', 'ICE 连接失败');
        }
      };

      // 检测编码器
      conn.getSenders().forEach(sender => {
        if (sender.track && sender.track.kind === 'video') {
          log('info', '视频轨道已添加: ' + sender.track.label);
        } else if (sender.track && sender.track.kind === 'audio') {
          log('info', '音频轨道已添加: ' + sender.track.label);
        }
      });

      return conn;
    }

    async function stopCast() {
      // 清除重连定时器
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
      reconnectAttempts = 0;

      // WHEP 模式：发送 DELETE 清理服务端会话
      if (whepResourceUrl) {
        try {
          await fetch(whepResourceUrl, { method: 'DELETE' });
        } catch (e) {
          // 忽略清理失败
        }
      }

      // 关闭 WebSocket
      if (wsConnection) {
        wsConnection.close();
        wsConnection = null;
      }

      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      cleanupPeerConnection();

      document.getElementById('preview').srcObject = null;
      document.getElementById('ph').style.display = 'block';
      document.getElementById('btnStart').style.display = 'inline-block';
      document.getElementById('btnStop').style.display = 'none';
      document.getElementById('sessionCard').style.display = 'none';

      sessionId = null;
      whepResourceUrl = null;
      setStatus('', '已停止');
      log('info', '投屏已停止');
    }

    window.addEventListener('beforeunload', stopCast);
  </script>
</body>
</html>
