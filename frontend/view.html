<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>观看屏幕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #1e3c72;
      color: white;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { margin-bottom: 2rem; }
    .container {
      background: rgba(255,255,255,0.1);
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      width: 100%;
      max-width: 800px;
    }
    input {
      padding: 1rem;
      font-size: 1.2rem;
      border-radius: 8px;
      border: none;
      width: 300px;
      text-align: center;
      margin: 1rem 0;
    }
    button {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      cursor: pointer;
      margin: 0.5rem;
    }
    button:hover { background: #5568d3; }
    #status { margin-top: 1rem; font-size: 1.1rem; }
    video {
      width: 100%;
      max-width: 1200px;
      margin-top: 2rem;
      background: black;
      border-radius: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>观看屏幕</h1>

  <div class="container">
    <p>请输入会话 ID：</p>
    <input type="text" id="sessionId" placeholder="例如: sess_abc123">
    <br>
    <button onclick="join()">连接</button>
    <button onclick="disconnect()" style="display:none;" id="disconnectBtn">断开</button>
    <p id="status">等待连接...</p>
  </div>

  <video id="video" autoplay playsinline muted></video>

  <script>
    // 动态获取 WebSocket URL
    const wsHost = window.location.hostname || 'localhost';
    const WS_URL = `ws://${wsHost}:8081`;
    let ws = null;
    let pc = null;
    let sessionId = null;

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    async function join() {
      sessionId = document.getElementById('sessionId').value.trim();
      if (!sessionId) {
        alert('请输入会话 ID');
        return;
      }

      setStatus('正在连接...');

      try {
        ws = new WebSocket(WS_URL);

        ws.onopen = () => {
          console.log('[WS] WebSocket 已连接');
          setStatus('已连接服务器，加入会话...');
          ws.send(JSON.stringify({
            type: 'join_session',
            session_id: sessionId
          }));
        };

        ws.onmessage = async (event) => {
          const data = JSON.parse(event.data);
          console.log('[WS] 收到消息:', data.type);

          if (data.type === 'offer') {
            console.log('[WS] 收到 Offer，开始处理...');
            await handleOffer(data.sdp);
          } else if (data.type === 'ice_candidate') {
            console.log('[WS] 收到 ICE 候选');
            await handleIce(data.candidate);
          } else if (data.type === 'error') {
            console.error('[WS] 错误:', data.message);
            setStatus('错误: ' + data.message);
          } else if (data.type === 'session_ended') {
            console.warn('[WS] 会话已结束');
            setStatus('会话已结束');
          }
        };

        ws.onerror = (error) => {
          console.error('[WS] WebSocket 错误:', error);
          setStatus('连接失败');
        };

        ws.onclose = () => {
          console.log('[WS] WebSocket 连接关闭');
          setStatus('连接已断开');
        };

      } catch (error) {
        setStatus('错误: ' + error.message);
      }
    }

    function createPeerConnection() {
      console.log('[PC] 创建 PeerConnection');
      const config = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      };
      pc = new RTCPeerConnection(config);

      // ICE 收集状态
      pc.onicegatheringstatechange = () => {
        console.log('[PC] ICE 收集状态:', pc.iceGatheringState);
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          console.log('[PC] 发送 ICE 候选:', event.candidate.candidate.split(':')[0]);
          ws.send(JSON.stringify({
            type: 'ice_candidate',
            session_id: sessionId,
            candidate: JSON.stringify(event.candidate)
          }));
        } else {
          console.log('[PC] ICE 候选收集完成');
        }
      };

      pc.ontrack = (event) => {
        console.log('[PC] 收到远程轨道:', event.track.kind, '标签:', event.track.label);
        console.log('[PC] 流数量:', event.streams.length);

        const video = document.getElementById('video');
        video.srcObject = event.streams[0];
        video.style.display = 'block';

        // 尝试播放
        video.play().then(() => {
          console.log('[Video] 播放成功');
          setStatus('已连接 - 视频播放中');
        }).catch(err => {
          console.error('[Video] 播放失败:', err);
          setStatus('错误: 视频播放失败 - ' + err.message);
        });

        document.getElementById('disconnectBtn').style.display = 'inline-block';
      };

      pc.onconnectionstatechange = () => {
        console.log('[PC] 连接状态:', pc.connectionState);
        if (pc.connectionState === 'connected') {
          console.log('[PC] WebRTC 连接成功!');
        } else if (pc.connectionState === 'failed') {
          console.error('[PC] WebRTC 连接失败');
        }
      };

      pc.oniceconnectionstatechange = () => {
        console.log('[PC] ICE 连接状态:', pc.iceConnectionState);
      };
    }

    async function handleOffer(offerStr) {
      console.log('[Offer] 处理 SDP Offer...');
      if (!pc) createPeerConnection();

      const offer = JSON.parse(offerStr);
      console.log('[Offer] Offer 类型:', offer.type);
      console.log('[Offer] 媒体数量:', (offer.sdp || '').split('m=').length - 1);

      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      console.log('[Offer] Remote Description 已设置');

      const answer = await pc.createAnswer();
      console.log('[Offer] Answer 已创建');

      await pc.setLocalDescription(answer);
      console.log('[Offer] Local Description 已设置');

      ws.send(JSON.stringify({
        type: 'answer',
        session_id: sessionId,
        sdp: JSON.stringify(answer)
      }));
      console.log('[Offer] Answer 已发送');
    }

    async function handleIce(candidateStr) {
      if (!pc) return;
      const candidate = JSON.parse(candidateStr);
      await pc.addIceCandidate(new RTCIceCandidate(candidate));
    }

    function disconnect() {
      if (pc) {
        pc.close();
        pc = null;
      }
      if (ws) {
        ws.close();
        ws = null;
      }
      document.getElementById('video').style.display = 'none';
      document.getElementById('disconnectBtn').style.display = 'none';
      setStatus('已断开');
    }
  </script>
</body>
</html>
