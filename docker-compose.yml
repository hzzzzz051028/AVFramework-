version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: avframework-backend
    ports:
      - "8080:8080"
      - "8081:8081"
      - "1935:1935"
    volumes:
      - ./backend/hls:/app/hls
      - ./backend/temp:/app/temp
    environment:
      - HTTP_PORT=8080
      - WEBSOCKET_PORT=8081
      - RTMP_PORT=1935
      - HLS_PATH=/app/hls
    restart: unless-stopped
    networks:
      - avframework-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: avframework-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - avframework-network

networks:
  avframework-network:
    driver: bridge
